# Build Linux x86_64 and macOS arm64 wheels, retaining all supported games.
# Test the installed wheel's Geister API by default. Full Python/ML tests
# can be enabled for a manual run; build_and_test also retains broad coverage.
name: wheels

on:
  # Test the wheels for each PR to ensure the PR doesn't break them.
  pull_request:
    branches: [ master ]
  # Workflow dispatch is a way to manually trigger workflows. This will be
  # used to build and test the wheels manually for releases.
  workflow_dispatch:
    inputs:
      name:
        description: 'Workflow dispatch (triggered manually)'
        required: false
        default: 'No name specified'
      full_tests:
        description: 'Also run the full Python suite, including JAX/PyTorch'
        type: boolean
        default: false

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }} ${{ matrix.NAME }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
        - os: ubuntu-24.04
          NAME: "Linux"
          OS_TYPE: "Linux"
          CI_PYBIN: python3.11
          OS_PYTHON_VERSION: 3.11
          OPEN_SPIEL_ABSL_VERSION: "20250814.1"
          CIBW_VERSION: 3.2.1
          CIBW_ENABLE: all
          CIBW_ENVIRONMENT: "CXX=$(which g++) OPEN_SPIEL_BUILDING_WHEEL='ON' OPEN_SPIEL_BUILD_WITH_ACPC='ON' OPEN_SPIEL_BUILD_WITH_HANABI='ON' OPEN_SPIEL_BUILD_WITH_ROSHAMBO='ON'"
          CIBW_BUILD: cp311-manylinux_x86_64 #cp312-manylinux_x86_64 cp313-manylinux_x86_64 cp314-manylinux_x86_64

        #- os: ubuntu-24.04-arm
        #  NAME: "Linux_arm64"
        #  OS_TYPE: "Linux"
        #  CI_PYBIN: python3.12
        #  OS_PYTHON_VERSION: 3.12
        #  OPEN_SPIEL_ABSL_VERSION: "20250814.1"
        #  CIBW_VERSION: 3.2.1
        #  CIBW_ENABLE: all
        #  CIBW_ENVIRONMENT: "CXX=$(which g++) OPEN_SPIEL_BUILDING_WHEEL='ON' OPEN_SPIEL_BUILD_WITH_ACPC='ON' OPEN_SPIEL_BUILD_WITH_HANABI='ON' OPEN_SPIEL_BUILD_WITH_ROSHAMBO='ON'"
        #  CIBW_BUILD: cp311-manylinux_aarch64 cp312-manylinux_aarch64 cp313-manylinux_aarch64 cp314-manylinux_aarch64

        - os: macos-14
          OS_TYPE: "Darwin"
          CI_PYBIN: python3.11
          OS_PYTHON_VERSION: 3.11
          CIBW_VERSION: 3.2.1
          CIBW_ENABLE: all
          CIBW_ENVIRONMENT: "OPEN_SPIEL_BUILDING_WHEEL='ON' OPEN_SPIEL_BUILD_WITH_ACPC='ON' OPEN_SPIEL_BUILD_WITH_HANABI='ON' OPEN_SPIEL_BUILD_WITH_ROSHAMBO='ON'"
          CIBW_BUILD: cp311-macosx_arm64 #cp312-macosx_arm64 cp313-macosx_arm64
        #- os: macos-15
        #  NAME: "MacOS15_Python_3.13"
        #  OS_TYPE: "Darwin"
        #  CI_PYBIN: python3.13
        #  OPEN_SPIEL_ABSL_VERSION: "20250814.1"
        #  OS_PYTHON_VERSION: 3.13
        #  CIBW_VERSION: 3.2.1
        #  CIBW_ENVIRONMENT: "OPEN_SPIEL_BUILDING_WHEEL='ON' OPEN_SPIEL_BUILD_WITH_ACPC='ON' OPEN_SPIEL_BUILD_WITH_HANABI='ON' OPEN_SPIEL_BUILD_WITH_ROSHAMBO='ON'"
        #  CIBW_BUILD: cp314-macosx_arm64
    env:
      CCACHE_DIR: ${{ github.workspace }}/../uma-spiel-ccache
      OPEN_SPIEL_BUILDING_WHEEL: ON
      OPEN_SPIEL_BUILD_WITH_ACPC: ON
      OPEN_SPIEL_BUILD_WITH_HANABI: ON
      OPEN_SPIEL_BUILD_WITH_ROSHAMBO: ON
      OPEN_SPIEL_ABSL_VERSION: ${{ matrix.OPEN_SPIEL_ABSL_VERSION }}
      OS_TYPE: ${{ matrix.OS_TYPE }}
      OS_PYTHON_VERSION: ${{ matrix.OS_PYTHON_VERSION }}
      CI_PYBIN: ${{ matrix.CI_PYBIN }}
      CIBW_VERSION: ${{ matrix.CIBW_VERSION }}
      CIBW_ENABLE: ${{ matrix.CIBW_ENABLE }}
      CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
      CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
      CIBW_BUILD: ${{ matrix.CIBW_BUILD }}
      CIBW_BEFORE_TEST: python -m pip install --upgrade pip
      CIBW_TEST_COMMAND: /bin/bash {project}/open_spiel/scripts/test_wheel.sh geister {project}
      # CMake initializes its compiler launchers from these environment variables.
      CIBW_ENVIRONMENT: >-
        ${{ matrix.CIBW_ENVIRONMENT }}
        CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
        CCACHE_DIR="${{ github.workspace }}/../uma-spiel-ccache"
        CCACHE_BASEDIR="${{ github.workspace }}"
        CCACHE_COMPILERCHECK=content CCACHE_MAXSIZE=500M
      # Linux builds run in a container. /host exposes the runner filesystem,
      # so the cache restored/saved by actions/cache is also used by the compiler.
      CIBW_ENVIRONMENT_LINUX: >-
        ${{ matrix.CIBW_ENVIRONMENT }}
        CMAKE_C_COMPILER_LAUNCHER=ccache CMAKE_CXX_COMPILER_LAUNCHER=ccache
        CCACHE_DIR="/host${{ github.workspace }}/../uma-spiel-ccache"
        CCACHE_BASEDIR=/project
        CCACHE_COMPILERCHECK=content CCACHE_MAXSIZE=500M
      CIBW_BEFORE_ALL_LINUX: command -v ccache || (yum install -y epel-release && yum install -y ccache)
      CIBW_BEFORE_BUILD: ccache --zero-stats

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # A new key per run lets newly compiled objects extend the cache.
          # Source changes are checked by ccache, not used to invalidate it.
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.CIBW_BUILD }}-${{ hashFiles('.github/workflows/wheels.yml', 'setup.py', 'open_spiel/scripts/global_variables.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.CIBW_BUILD }}-${{ hashFiles('.github/workflows/wheels.yml', 'setup.py', 'open_spiel/scripts/global_variables.sh') }}-

      - name: Install macOS compiler cache
        if: runner.os == 'macOS'
        run: brew install ccache

      - name: Install
        run: |
          pwd
          uname -a
          ./open_spiel/scripts/ci_python_prechecks.sh
          [[ "${OS_TYPE}" = "Darwin" ]] && brew install python@${OS_PYTHON_VERSION}
          [[ "${OS_TYPE}" = "Darwin" ]] && brew link --force python@${OS_PYTHON_VERSION}
          which g++
          g++ --version
          chmod +x install.sh
          # This is needed to grab OpenSpiel dependencies.
          [[ "${OS_TYPE}" = "Darwin" ]] && ./install.sh `which python${OS_PYTHON_VERSION}`
          [[ "${OS_TYPE}" = "Linux" ]] && ./install.sh `which python3`
          # ML dependencies are only needed for the optional full tests.
          ${CI_PYBIN} -m venv ./venv
          source ./venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip --version
          python -m pip install --upgrade setuptools
          python -m pip install --upgrade -r requirements.txt -q
          python -m pip install build twine
          python -m pip install cibuildwheel==${CIBW_VERSION}
      - name: Install optional full-test dependencies
        if: ${{ inputs.full_tests == true }}
        run: |
          source ./venv/bin/activate
          source ./open_spiel/scripts/python_extra_deps.sh python
          python -m pip install --upgrade $OPEN_SPIEL_PYTHON_JAX_DEPS
          python -m pip install --upgrade $OPEN_SPIEL_PYTHON_PYTORCH_DEPS --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          python -m pip install --upgrade $OPEN_SPIEL_PYTHON_MISC_DEPS
      - name: Build sdist
        run: |
          source ./venv/bin/activate
          python -m build --sdist
          twine check dist/*.tar.gz

      # Test the installed wheel via CIBW_TEST_COMMAND, inside the build environment.
      - name: Build bdist_wheel and run tests
        run: |
          [[ "${OS_TYPE}" = "Darwin" ]] && xcodebuild -version
          source ./venv/bin/activate
          python -m cibuildwheel --output-dir wheelhouse
          ls -l wheelhouse

      # Install the built wheel and run the full tests on this host. The full
      # tests include all the ones that use the machine learning libraries,
      # such as PyTorch, and JAX.
      - name: Install bdist_wheel and full tests
        if: ${{ inputs.full_tests == true }}
        run: |
          source ./venv/bin/activate
          ./open_spiel/scripts/test_wheel.sh full `pwd` python

      - uses: actions/upload-artifact@v6
        with:
          name: artifact-${{ matrix.os }}-${{ matrix.NAME }}
          path: |
            dist/*.tar.gz
            ./wheelhouse/*.whl

